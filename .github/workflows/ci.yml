name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: test -z "$(gofmt -l .)"
      - run: go build ./...   # includes examples/
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go run ./gentest/cmd/gen && git diff --exit-code gentest/   # generated code is current
      - run: go test -run xxx -fuzz FuzzFromJSON -fuzztime 20s .
      - run: go test -run xxx -fuzz FuzzGeneratedDifferential -fuzztime 20s ./gentest/
      - name: lathe adapter (nested module)
        working-directory: lathe
        run: go vet ./... && go test -race ./...
